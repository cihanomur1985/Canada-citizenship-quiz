<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business English Kartları</title>
<style>
:root{
  --navy:#152841; --paper:#F6F4EE; --card:#ffffff; --ink:#1a1a1a; --muted:#6b6f76;
  --red:#a8333f; --red-dark:#7d2530; --gold:#b8933f; --green:#2f6b4f; --green-dark:#22503b; --line:#dedad0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;min-height:100vh;}
.app{max-width:560px;margin:0 auto;padding:0 16px 40px;}
header{background:var(--navy);color:var(--paper);margin:0 -16px 16px;padding:20px 16px 16px;border-bottom:4px solid var(--red);}
header h1{margin:0 0 4px;font-size:1.35rem;font-weight:600;}
header p{margin:0;font:0.82rem -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#c7d2e0;}
.ui{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
.tabs{display:flex;gap:8px;margin-bottom:12px;}
.tabs button{flex:1;padding:10px 6px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:0.82rem;font-weight:600;color:var(--navy);cursor:pointer;}
.tabs button.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.tabs .n{display:inline-block;min-width:1.4em;margin-left:4px;padding:1px 6px;border-radius:10px;font-size:0.75rem;background:rgba(0,0,0,.08);}
.tabs button.active .n{background:rgba(255,255,255,.2);}
.chips{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.chips button{padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:20px;font-size:0.78rem;cursor:pointer;color:var(--ink);}
.chips button.active{background:var(--gold);border-color:var(--gold);color:#fff;}
.progress{font-size:0.78rem;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px;}
.bar i{display:block;height:100%;background:var(--green);width:0;transition:width .3s;}

.scene{perspective:1200px;}
.card{position:relative;width:100%;min-height:300px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s;}
.card.flipped{transform:rotateY(180deg);}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 2px 0 var(--line);}
.back{transform:rotateY(180deg);border-top:5px solid var(--gold);}
.front{border-top:5px solid var(--navy);}
.word{font-size:2.4rem;font-weight:600;line-height:1.15;margin:0;word-break:break-word;color:var(--navy);}
.tr{font-size:2rem;font-weight:600;color:var(--red);margin:0;line-height:1.2;}
.sent{margin:18px 0 0;font-size:0.8rem;line-height:1.5;color:var(--muted);max-width:44ch;}
.sent mark{background:#f4e6bd;color:var(--ink);border-radius:3px;padding:0 2px;}
.src{margin-top:12px;font:0.68rem -apple-system,sans-serif;color:var(--muted);}
.hint{position:absolute;bottom:10px;left:0;right:0;font:0.7rem -apple-system,sans-serif;color:#a3a6ab;}
.speak{margin-top:12px;border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:6px 14px;font-size:0.8rem;cursor:pointer;}
.sp{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.sent{font-size:0.95rem!important;color:#3d4148!important;}
.tr-s{margin-top:8px!important;color:var(--red)!important;font-style:italic;}
.auto{display:flex;align-items:center;gap:6px;font-size:0.78rem;color:var(--muted);margin:-6px 0 12px;}
.chips{flex-wrap:nowrap!important;overflow-x:auto;padding-bottom:4px;}
.chips button{white-space:nowrap;}
.card{min-height:380px!important;}
.word{font-size:2rem!important;}
.tr{font-size:1.6rem!important;}
.small-word{font-size:0.95rem;color:var(--navy);margin:0 0 6px;}

.actions{display:flex;gap:10px;margin-top:16px;}
.actions button{flex:1;padding:15px 8px;border:none;border-radius:12px;color:#fff;font-size:0.95rem;font-weight:600;cursor:pointer;line-height:1.25;}
.actions small{display:block;font-weight:400;font-size:0.72rem;opacity:.85;margin-top:2px;}
.btn-wrong{background:var(--red);} .btn-wrong:active{background:var(--red-dark);}
.btn-known{background:var(--green);} .btn-known:active{background:var(--green-dark);}
.undo{display:block;margin:12px auto 0;background:none;border:none;color:var(--muted);font-size:0.78rem;text-decoration:underline;cursor:pointer;}

.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;}
.panel h2{margin:0 0 4px;font-size:1.05rem;color:var(--navy);}
.panel p.sub{margin:0 0 12px;font-size:0.8rem;color:var(--muted);}
.list{max-height:60vh;overflow:auto;border-top:1px solid var(--line);}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:0.9rem;align-items:center;}
.row b{color:var(--navy);} .row span{color:var(--red);text-align:right;}
.row button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:4px 8px;font-size:0.72rem;cursor:pointer;white-space:nowrap;}
.primary{width:100%;margin-top:12px;padding:13px;border:none;border-radius:12px;background:var(--navy);color:#fff;font-size:0.92rem;font-weight:600;cursor:pointer;}
.primary.red{background:var(--red);}
.ghost{width:100%;margin-top:8px;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:0.85rem;cursor:pointer;color:var(--ink);}
.empty{padding:26px 8px;text-align:center;color:var(--muted);font-size:0.88rem;}
.done{text-align:center;padding:10px 4px 4px;}
.done h2{font-size:1.3rem;margin:6px 0;}
.done .big{font-size:2.6rem;}
.hidden{display:none!important;}
@media (prefers-reduced-motion:reduce){.card{transition:none;}.bar i{transition:none;}}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
</style>
</head>
<body>
<div class="app ui">
  <header>
    <h1>Business English</h1>
    <p>İş İngilizcesi kelime kartları · <span id="total"></span> kelime · örnek cümleli ve sesli</p>
  </header>

  <div class="tabs">
    <button id="tabStudy" class="active">Çalış <span class="n" id="nLeft">0</span></button>
    <button id="tabKnown">Doğru kutusu <span class="n" id="nKnown">0</span></button>
    <button id="tabWrong">Yanlış sepeti <span class="n" id="nWrong">0</span></button>
  </div>

  <section id="viewStudy">
    <div class="chips" id="chips"></div>
    <label class="auto"><input type="checkbox" id="autoSpeak"> Kart açılınca otomatik oku</label>
    <div class="progress"><span id="progText"></span><span id="progLeft"></span></div>
    <div class="bar"><i id="bar"></i></div>

    <div id="deck">
      <div class="scene">
        <div class="card" id="card" role="button" tabindex="0" aria-label="Kartı çevir">
          <div class="face front">
            <p class="word" id="fWord"></p>
            <div class="sp"><button class="speak" id="speak" type="button">🔊 Kelime</button><button class="speak" id="speakS" type="button">🔊 Cümle</button></div>
            <p class="sent" id="fSent"></p>
            <p class="src" id="fSrc"></p>
            <div class="hint">Türkçesi için karta dokun</div>
          </div>
          <div class="face back">
            <p class="small-word" id="bWord"></p>
            <p class="tr" id="bTr"></p>
            <p class="sent" id="bSent"></p>
            <p class="sent tr-s" id="bSentTr"></p>
            <div class="sp"><button class="speak" id="speakB" type="button">🔊 Cümle</button></div>
            <div class="hint">Tekrar dokun: İngilizceye dön</div>
          </div>
        </div>
      </div>
      <div class="actions">
        <button class="btn-wrong" id="btnWrong">✗ Bilmiyorum<small>Yanlış sepetine at</small></button>
        <button class="btn-known" id="btnKnown">✓ Biliyorum<small>Doğru kutusuna at</small></button>
      </div>
      <button class="undo hidden" id="undo">↩ Son kartı geri al</button>
    </div>

    <div id="finished" class="panel hidden">
      <div class="done">
        <div class="big">🎉</div>
        <h2>Bu desteyi bitirdin</h2>
        <p class="sub" id="finText"></p>
      </div>
      <button class="primary red hidden" id="retryWrong">Yanlış sepetini tekrar çalış</button>
      <button class="ghost" id="resetAll">Baştan başla (her şeyi sıfırla)</button>
    </div>
  </section>

  <section id="viewKnown" class="hidden">
    <div class="panel">
      <h2>Doğru kutusu</h2>
      <p class="sub">Bildiğin kelimeler. Geri almak için "Geri koy"a bas.</p>
      <div class="list" id="listKnown"></div>
    </div>
  </section>

  <section id="viewWrong" class="hidden">
    <div class="panel">
      <h2>Yanlış sepeti</h2>
      <p class="sub">Bilemediğin kelimeler.</p>
      <div class="list" id="listWrong"></div>
      <button class="primary red" id="studyWrong">Bu sepeti tekrar çalış</button>
    </div>
  </section>
</div>

<script>
const CATS = [{"k": "meet", "n": "Toplantı ve İletişim"}, {"k": "mgmt", "n": "Yönetim ve Liderlik"}, {"k": "fin", "n": "Finans ve Muhasebe"}, {"k": "sales", "n": "Satış ve Pazarlama"}, {"k": "hr", "n": "İnsan Kaynakları ve Kariyer"}, {"k": "nego", "n": "Müzakere ve Sözleşmeler"}, {"k": "log", "n": "Lojistik ve Tedarik Zinciri"}, {"k": "strat", "n": "Strateji ve Proje Yönetimi"}, {"k": "econ", "n": "Ekonomi ve Ticaret"}, {"k": "cs", "n": "Müşteri Hizmetleri"}, {"k": "phr", "n": "Deyimler ve Phrasal Verbs"}];
const CARDS = [{"id": "agenda", "w": "agenda", "tr": "gündem", "s": "Please send me the agenda before the meeting.", "st": "Lütfen toplantıdan önce gündemi bana gönder.", "c": "meet"}, {"id": "minutes", "w": "minutes", "tr": "toplantı tutanağı", "s": "Who is taking the minutes today?", "st": "Bugün tutanağı kim tutuyor?", "c": "meet"}, {"id": "attendee", "w": "attendee", "tr": "katılımcı", "s": "All attendees must register by Friday.", "st": "Tüm katılımcılar cuma gününe kadar kayıt olmalı.", "c": "meet"}, {"id": "chair", "w": "chair", "tr": "toplantıya başkanlık etmek", "s": "The CEO will chair the board meeting.", "st": "Yönetim kurulu toplantısına CEO başkanlık edecek.", "c": "meet"}, {"id": "brief", "w": "brief", "tr": "bilgi vermek, brifing vermek", "s": "Can you brief the team on the new process?", "st": "Ekibe yeni süreç hakkında bilgi verebilir misin?", "c": "meet"}, {"id": "follow up", "w": "follow up", "tr": "takip etmek", "s": "I will follow up with the client tomorrow.", "st": "Yarın müşteriyle takip görüşmesi yapacağım.", "c": "meet"}, {"id": "reschedule", "w": "reschedule", "tr": "yeniden planlamak, ertelemek", "s": "We need to reschedule the call to Monday.", "st": "Görüşmeyi pazartesiye ertelememiz gerekiyor.", "c": "meet"}, {"id": "postpone", "w": "postpone", "tr": "ertelemek", "s": "The launch has been postponed until next month.", "st": "Lansman gelecek aya ertelendi.", "c": "meet"}, {"id": "deadline", "w": "deadline", "tr": "son teslim tarihi", "s": "The deadline for the report is Thursday.", "st": "Raporun son teslim tarihi perşembe.", "c": "meet"}, {"id": "update", "w": "update", "tr": "güncel bilgi; güncellemek", "s": "Could you give us a quick update on the project?", "st": "Proje hakkında kısa bir güncel bilgi verebilir misin?", "c": "meet"}, {"id": "feedback", "w": "feedback", "tr": "geri bildirim", "s": "Thank you for your valuable feedback.", "st": "Değerli geri bildiriminiz için teşekkürler.", "c": "meet"}, {"id": "proposal", "w": "proposal", "tr": "teklif, öneri", "s": "We submitted our proposal to the client last week.", "st": "Teklifimizi geçen hafta müşteriye sunduk.", "c": "meet"}, {"id": "consensus", "w": "consensus", "tr": "fikir birliği", "s": "The team finally reached a consensus.", "st": "Ekip sonunda fikir birliğine vardı.", "c": "meet"}, {"id": "clarify", "w": "clarify", "tr": "açıklığa kavuşturmak", "s": "Could you clarify what you mean by that?", "st": "Bununla ne demek istediğini açıklar mısın?", "c": "meet"}, {"id": "summarize", "w": "summarize", "tr": "özetlemek", "s": "Let me summarize the main points.", "st": "Ana noktaları özetleyeyim.", "c": "meet"}, {"id": "item", "w": "item", "tr": "madde, gündem maddesi", "s": "Let's move on to the next item on the agenda.", "st": "Gündemdeki bir sonraki maddeye geçelim.", "c": "meet"}, {"id": "action item", "w": "action item", "tr": "yapılacak iş, aksiyon maddesi", "s": "Each action item has an owner and a due date.", "st": "Her aksiyon maddesinin bir sorumlusu ve bitiş tarihi var.", "c": "meet"}, {"id": "conference call", "w": "conference call", "tr": "telekonferans", "s": "We have a conference call with Istanbul at 9.", "st": "Saat 9'da İstanbul ile telekonferansımız var.", "c": "meet"}, {"id": "presentation", "w": "presentation", "tr": "sunum", "s": "Her presentation on the new budget was excellent.", "st": "Yeni bütçe hakkındaki sunumu mükemmeldi.", "c": "meet"}, {"id": "handout", "w": "handout", "tr": "dağıtılan doküman", "s": "Please take a handout as you come in.", "st": "Girerken lütfen bir doküman alın.", "c": "meet"}, {"id": "point out", "w": "point out", "tr": "dikkat çekmek, belirtmek", "s": "I'd like to point out a problem with the figures.", "st": "Rakamlardaki bir soruna dikkat çekmek istiyorum.", "c": "meet"}, {"id": "outline", "w": "outline", "tr": "ana hatlarıyla anlatmak", "s": "She outlined the plan for the next quarter.", "st": "Gelecek çeyreğin planını ana hatlarıyla anlattı.", "c": "meet"}, {"id": "objective", "w": "objective", "tr": "hedef, amaç", "s": "The main objective of this meeting is to agree on a budget.", "st": "Bu toplantının ana amacı bütçe üzerinde anlaşmak.", "c": "meet"}, {"id": "input", "w": "input", "tr": "katkı, görüş", "s": "We value your input on this decision.", "st": "Bu karardaki görüşünüze değer veriyoruz.", "c": "meet"}, {"id": "wrap up", "w": "wrap up", "tr": "toparlamak, bitirmek", "s": "Let's wrap up the meeting; we're out of time.", "st": "Toplantıyı toparlayalım, süremiz doldu.", "c": "meet"}, {"id": "in charge of", "w": "in charge of", "tr": "sorumlu", "s": "Who is in charge of the new project?", "st": "Yeni projeden kim sorumlu?", "c": "meet"}, {"id": "cc", "w": "cc", "tr": "bilgi olarak eklemek (e-posta)", "s": "Please cc my manager on the email.", "st": "Lütfen müdürümü e-postaya bilgi olarak ekle.", "c": "meet"}, {"id": "attachment", "w": "attachment", "tr": "ek (e-posta eki)", "s": "Please find the invoice in the attachment.", "st": "Faturayı ekte bulabilirsiniz.", "c": "meet"}, {"id": "reminder", "w": "reminder", "tr": "hatırlatma", "s": "This is a friendly reminder about tomorrow's meeting.", "st": "Bu, yarınki toplantı için nazik bir hatırlatmadır.", "c": "meet"}, {"id": "regarding", "w": "regarding", "tr": "ile ilgili, hakkında", "s": "I am writing regarding your recent order.", "st": "Son siparişinizle ilgili yazıyorum.", "c": "meet"}, {"id": "acknowledge", "w": "acknowledge", "tr": "teyit etmek, aldığını bildirmek", "s": "Please acknowledge receipt of this email.", "st": "Lütfen bu e-postayı aldığınızı teyit edin.", "c": "meet"}, {"id": "urgent", "w": "urgent", "tr": "acil", "s": "This is an urgent matter that needs your attention.", "st": "Bu, ilgilenmenizi gerektiren acil bir konu.", "c": "meet"}, {"id": "availability", "w": "availability", "tr": "müsaitlik", "s": "Please let me know your availability next week.", "st": "Lütfen gelecek haftaki müsaitliğini bildir.", "c": "meet"}, {"id": "touch base", "w": "touch base", "tr": "kısaca gö  people.", "st": "İyi liderler insanlarını motive eder.", "c": "mgmt"}, {"id": "empower", "w": "empower", "tr": "yetkilendirmek, güç vermek", "s": "We want to empower staff to make decisions.", "st": "Personelin karar verebilmesini sağlamak istiyoruz.", "c": "mgmt"}, {"id": "decision-making", "w": "decision-making", "tr": "karar verme", "s": "Fast decision-making is important in operations.", "st": "Operasyonlarda hızlı karar verme önemlidir.", "c": "mgmt"}, {"id": "approve", "w": "approve", "tr": "onaylamak", "s": "The budget was approved by the board.", "st": "Bütçe yönetim kurulu tarafından onaylandı.", "c": "mgmt"}, {"id": "authorize", "w": "authorize", "tr": "yetki vermek, izin vermek", "s": "Only managers can authorize refunds.", "st": "Yalnızca yöneticiler iade onayı verebilir.", "c": "mgmt"}, {"id": "policy", "w": "policy", "tr": "politika, kural", "s": "Company policy does not allow this.", "st": "Şirket politikası buna izin vermiyor.", "c": "mgmt"}, {"id": "procedure", "w": "procedure", "tr": "prosedür", "s": "Please follow the standard procedure.", "st": "Lütfen standart prosedürü izleyin.", "c": "mgmt"}, {"id": "implement", "w": "implement", "tr": "uygulamak, hayata geçirmek", "s": "We will implement the new system in January.", "st": "Yeni sistemi ocak ayında uygulamaya koyacağız.", "c": "mgmt"}, {"id": "efficiency", "w": "efficiency", "tr": "verimlilik", "s": "The new software improved our efficiency.", "st": "Yeni yazılım verimliliğimizi artırdı.", "c": "mgmt"}, {"id": "productivity", "w": "productivity", "tr": "üretkenlik", "s": "Remote work increased productivity.", "st": "Uzaktan çalışma üretkenliği artırdı.", "c": "mgmt"}, {"id": "headquarters", "w": "headquarters", "tr": "genel merkez", "s": "Our headquarters is in Istanbul.", "st": "Genel merkezimiz İstanbul'da.", "c": "mgmt"}, {"id": "branch", "w": "branch", "tr": "şube", "s": "The company opened a new branch in Bucharest.", "st": "Şirket Bükreş'te yeni bir şube açtı.", "c": "mgmt"}, {"id": "de hızlı, zamanında", "s": "Thank you for your prompt reply.", "st": "Hızlı yanıtınız için teşekkürler.", "c": "cs"}, {"id": "convenient", "w": "convenient", "tr": "uygun, elverişli", "s": "What time is convenient for you?", "st": "Hangi saat sizin için uygun?", "c": "cs"}, {"id": "policy·cs", "w": "policy", "tr": "poliçe; politika", "s": "Our refund policy is on the website.", "st": "İade politikamız web sitesinde yer alıyor.", "c": "cs"}, {"id": "warranty", "w": "warranty", "tr": "garanti", "s": "The product has a two-year warranty.", "st": "Ürünün iki yıllık garantisi var.", "c": "cs"}, {"id": "replacement", "w": "replacement", "tr": "yenisiyle değiştirme", "s": "We will send a replacement free of charge.", "st": "Ücretsiz olarak yenisini göndereceğiz.", "c": "cs"}, {"id": "free of charge", "w": "free of charge", "tr": "ücretsiz", "s": "Delivery is free of charge.", "st": "Teslimat ücretsizdir.", "c": "cs"}, {"id": "appreciate", "w": "appreciate", "tr": "takdir etmek, minnettar olmak", "s": "We appreciate your patience.", "st": "Sabrınız için minnettarız.", "c": "cs"}, {"id": "carry out", "w": "carry out", "tr": "yürütmek, gerçekleştirmek", "s": "We will carry out a safety check.", "st": "Bir güvenlik kontrolü gerçekleştireceğiz.", "c": "phr"}, {"id": "set up", "w": "set up", "tr": "kurmak", "s": "They set up a new office in Romania.", "st": "Romanya'da yeni bir ofis kurdular.", "c": "phr"}, {"id": "take over", "w": "take over", "tr": "devralmak", "s": "A new manager will take over the station.", "st": "İstasyonu yeni bir müdür devralacak.", "c": "phr"}, {"id": "turn down", "w": "turn down", "tr": "reddetmek", "s": "They turned down our offer.", "st": "Teklifimizi reddettiler.", "c": "phr"}, {"id": "call off", "w": "call off", "tr": "iptal etmek", "s": "The meeting was called off.", "st": "Toplantı iptal edildi.", "c": "phr"}, {"id": "put off", "w": "put off", "tr": "ertelemek", "s": "We can't put off this decision any longer.", "st": "Bu kararı daha fazla erteleyemeyiz.", "c": "phr"}, {"id": "bring up", "w": "bring up", "tr": "gündeme getirmek", "s": "She brought up the budget issue.", "st": "Bütçe konusunu gündeme getirdi.", "c": "phr"}, {"id": "go over", "w": "go over", "tr": "gözden geçirmek", "s": "Let's go over the figures again.", "st": "Rakamları tekrar gözden geçirelim.", "c": "phr"}, {"id": "fill in", "w": "fill in", "tr": "doldurmak (form)", "s": "Please fill in this form.", "st": "Lütfen bu formu doldurun.", "c": "phr"}, {"id": "fill in for", "w": "fill in for", "tr": "birinin yerine bakmak", "s": "Can you fill in for me on Monday?", "st": "Pazartesi benim yerime bakabilir misin?", "c": "phr"}, {"id": "run out of", "w": "run out of", "tr": "tükenmek", "s": "We are running out of time.", "st": "Zamanımız tükeniyor.", "c": "phr"}, {"id": "deal with", "w": "deal with", "tr": "ilgilenmek, başa çıkmak", "s": "I'll deal with this customer.", "st": "Bu müşteriyle ben ilgileneceğim.", "c": "phr"}, {"id": "cut back on", "w": "cut back on", "tr": "azaltmak, kısmak", "s": "We need to cut back on travel costs.", "st": "Seyahat masraflarını kısmamız gerekiyor.", "c": "phr"}, {"id": "back up", "w": "back up", "tr": "desteklemek; yedeklemek", "s": "Can you back up your claim with data?", "st": "İddianı verilerle destekleyebilir misin?", "c": "phr"}, {"id": "draw up", "w": "draw up", "tr": "hazırlamak (belge)", "s": "The lawyer drew up the contract.", "st": "Avukat sözleşmeyi hazırladı.", "c": "phr"}, {"id": "figure out", "w": "figure out", "tr": "çözmek, anlamak", "s": "We need to figure out what went wrong.", "st": "Neyin yanlış gittiğini anlamamız gerekiyor.", "c": "phr"}, {"id": "hand in", "w": "hand in", "tr": "teslim etmek", "s": "Please hand in your report by Friday.", "st": "Lütfen raporunu cumaya kadar teslim et.", "c": "phr"}, {"id": "keep up with", "w": "keep up with", "tr": "ayak uydurmak", "s": "It's hard to keep up with all the changes.", "st": "Tüm değişikliklere ayak uydurmak zor.", "c": "phr"}, {"id": "look forward to", "w": "look forward to", "tr": "dört gözle beklemek", "s": "I look forward to hearing from you.", "st": "Sizden haber almayı dört gözle bekliyorum.", "c": "phr"}, {"id": "come up with", "w": "come up with", "tr": "bulmak (fikir)", "s": "She came up with a great idea.", "st": "Harika bir fikir buldu.", "c": "phr"}, {"id": "lay out", "w": "lay out", "tr": "açıklamak, sunmak", "s": "He laid out the plan step by step.", "st": "Planı adım adım açıkladı.", "c": "phr"}, {"id": "point of contact", "w": "point of contact", "tr": "irtibat kişisi", "s": "I will be your point of contact.", "st": "İrtibat kişiniz ben olacağım.", "c": "phr"}, {"id": "ballpark figure", "w": "ballpark figure", "tr": "yaklaşık rakam", "s": "Can you give me a ballpark figure?", "st": "Bana yaklaşık bir rakam verebilir misin?", "c": "phr"}, {"id": "on the same page", "w": "on the same page", "tr": "aynı fikirde, aynı noktada", "s": "Let's make sure we are on the same page.", "st": "Aynı noktada olduğumuzdan emin olalım.", "c": "phr"}, {"id": "think outside the box", "w": "think outside the box", "tr": "kalıpların dışında düşünmek", "s": "We need to think outside the box.", "st": "Kalıpların dışında düşünmemiz gerekiyor.", "c": "phr"}, {"id": "get the ball rolling", "w": "get the ball rolling", "tr": "işi başlatmak", "s": "Let's get the ball rolling on this project.", "st": "Bu projeyi başlatalım.", "c": "phr"}, {"id": "back to square one", "w": "back to square one", "tr": "başa dönmek", "s": "The deal failed, so we're back to square one.", "st": "Anlaşma başarısız oldu, başa döndük.", "c": "phr"}, {"id": "cut corners", "w": "cut corners", "tr": "işi baştan savma yapmak", "s": "We never cut corners on safety.", "st": "Güvenlik konusunda asla işi baştan savma yapmayız.", "c": "phr"}, {"id": "a win-win situation", "w": "a win-win situation", "tr": "herkesin kazandığı durum", "s": "This partnership is a win-win situation.", "st": "Bu ortaklık herkesin kazandığı bir durum.", "c": "phr"}, {"id": "in the long run", "w": "in the long run", "tr": "uzun vadede", "s": "This will save money in the long run.", "st": "Bu uzun vadede para kazandıracak.", "c": "phr"}, {"id": "up to speed", "w": "up to speed", "tr": "güncel bilgiye sahip", "s": "Can you bring me up to speed?", "st": "Beni güncel duruma getirebilir misin?", "c": "phr"}, {"id": "hit the ground running", "w": "hit the ground running", "tr": "hızlı başlamak", "s": "The new manager hit the ground running.", "st": "Yeni müdür işe hızlı başladı.", "c": "phr"}, {"id": "keep me posted", "w": "keep me posted", "tr": "beni haberdar et", "s": "Please keep me posted on any changes.", "st": "Değişikliklerden lütfen beni haberdar et.", "c": "phr"}, {"id": "heads-up", "w": "heads-up", "tr": "önceden uyarı/bilgi", "s": "Thanks for the heads-up about the delay.", "st": "Gecikme hakkında önceden haber verdiğin için teşekkürler.", "c": "phr"}, {"id": "learning curve", "w": "learning curve", "tr": "öğrenme süreci", "s": "There is a steep learning curve with this system.", "st": "Bu sistemin öğrenme süreci zorlu.", "c": "phr"}, {"id": "red tape", "w": "red tape", "tr": "bürokrasi", "s": "There is too much red tape at customs.", "st": "Gümrükte çok fazla bürokrasi var.", "c": "phr"}, {"id": "call it a day", "w": "call it a day", "tr": "günü bitirmek", "s": "It's late, let's call it a day.", "st": "Geç oldu, bugünlük bu kadar.", "c": "phr"}, {"id": "the big picture", "w": "the big picture", "tr": "genel tablo", "s": "Don't forget the big picture.", "st": "Genel tabloyu unutma.", "c": "phr"}, {"id": "from scratch", "w": "from scratch", "tr": "sıfırdan", "s": "We built the tool from scratch.", "st": "Aracı sıfırdan yaptık.", "c": "phr"}, {"id": "by the book", "w": "by the book", "tr": "kurallara uygun", "s": "Everything must be done by the book.", "st": "Her şey kurallara uygun yapılmalı.", "c": "phr"}];
const KEY = 'be_vocab_v1';
const byWord = new Map(CARDS.map(c=>[c.id,c]));
let state = {known:[],wrong:[],order:[],src:'all'};
let history = [];   // last actions for undo (session only)

function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY)||'null');
    if(s && Array.isArray(s.known) && Array.isArray(s.wrong) && Array.isArray(s.order)){
      state = Object.assign(state, s);
    }
  }catch(e){}
  // drop words that no longer exist, append new ones
  const valid = w=>byWord.has(w);
  state.known = state.known.filter(valid);
  state.wrong = state.wrong.filter(valid);
  const seen = new Set(state.order.filter(valid));
  state.order = state.order.filter(valid);
  const fresh = CARDS.map(c=>c.id).filter(w=>!seen.has(w));
  shuffle(fresh); state.order.push(...fresh);
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const $ = id=>document.getElementById(id);
const esc = s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function queue(){
  const done = new Set([...state.known,...state.wrong]);
  return state.order.filter(w=>!done.has(w) && (state.src==='all' || byWord.get(w).c===state.src));
}
function sentenceHTML(c){
  const re = new RegExp('\\b('+c.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')\\b','i');
  const safe = esc(c.s);
  return safe.replace(re,'<mark>$1</mark>');
}
const catName = k=>(CATS.find(x=>x.k===k)||{}).n||'';
function srcLabel(c){ return catName(c.c); }

function render(){
  const q = queue();
  $('total').textContent = CARDS.length;
  $('nLeft').textContent = q.length;
  $('nKnown').textContent = state.known.length;
  $('nWrong').textContent = state.wrong.length;
  const pool = state.src==='all' ? CARDS.length : CARDS.filter(c=>c.c===state.src).length;
  const doneInPool = pool - q.length;
  $('progText').textContent = doneInPool+' / '+pool+' kart işlendi';
  $('progLeft').textContent = q.length+' kaldı';
  $('bar').style.width = (pool? doneInPool/pool*100 : 0)+'%';
  $('undo').classList.toggle('hidden', history.length===0);

  if(q.length===0){
    $('deck').classList.add('hidden');
    $('finished').classList.remove('hidden');
    const w = state.wrong.length;
    $('finText').textContent = 'Doğru kutusu: '+state.known.length+' · Yanlış sepeti: '+w;
    $('retryWrong').classList.toggle('hidden', w===0);
    return;
  }
  $('finished').classList.add('hidden');
  $('deck').classList.remove('hidden');
  const c = byWord.get(q[0]);
  const card = $('card');
  card.classList.remove('flipped');
  $('fWord').textContent = c.w;
  $('bWord').textContent = c.w;
  $('bTr').textContent = c.tr;
  $('fSent').innerHTML = sentenceHTML(c);
  $('bSent').innerHTML = sentenceHTML(c);
  $('bSentTr').textContent = c.st;
  if(state.auto && lastShown!==c.id){ lastShown=c.id; say(c.w, ()=>say(c.s)); } lastShown=c.id;
  $('fSrc').textContent = srcLabel(c);
}
function currentWord(){ const q=queue(); return q.length? q[0] : null; }
let lastShown=null;

function mark(kind){
  const w = currentWord(); if(!w) return;
  state[kind].push(w);
  history.push({w,kind});
  if(history.length>30) history.shift();
  save(); render();
}
$('btnKnown').onclick = ()=>mark('known');
$('btnWrong').onclick = ()=>mark('wrong');
$('undo').onclick = ()=>{
  const h = history.pop(); if(!h) return;
  state[h.kind] = state[h.kind].filter(x=>x!==h.w);
  // put it back at the front of the order so it is the next card
  state.order = [h.w, ...state.order.filter(x=>x!==h.w)];
  save(); render();
};
function flip(){ $('card').classList.toggle('flipped'); }
$('card').onclick = e=>{ if(e.target.closest('.speak')) return; flip(); };
$('card').onkeydown = e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); flip(); } };
document.addEventListener('keydown', e=>{
  if($('viewStudy').classList.contains('hidden')||$('deck').classList.contains('hidden')) return;
  if(e.key==='ArrowRight') mark('known');
  else if(e.key==='ArrowLeft') mark('wrong');
});
let voice=null;
function pickVoice(){
  try{
    const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
    const pref=['Google US English','Samantha','Microsoft Aria','Microsoft Jenny','Microsoft Guy','Google UK English Female','Daniel'];
    voice = pref.map(n=>vs.find(v=>v.name.includes(n))).find(Boolean) || vs.find(v=>/en[-_]US/i.test(v.lang)) || vs[0] || null;
  }catch(e){}
}
try{ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }catch(e){}
function say(text, then){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = voice ? voice.lang : 'en-US'; if(voice) u.voice = voice; u.rate = 0.9;
    if(then) u.onend = ()=>setTimeout(then,350);
    speechSynthesis.speak(u);
  }catch(err){}
}
function cur(){ const w=currentWord(); return w? byWord.get(w) : null; }
$('speak').onclick = e=>{ e.stopPropagation(); const c=cur(); if(c) say(c.w); };
$('speakS').onclick = e=>{ e.stopPropagation(); const c=cur(); if(c) say(c.s); };
$('speakB').onclick = e=>{ e.stopPropagation(); const c=cur(); if(c) say(c.s); };
$('autoSpeak').onchange = e=>{ state.auto = e.target.checked; save(); if(state.auto){ const c=cur(); if(c) say(c.w, ()=>say(c.s)); } };

// source filter
$('chips').onclick = e=>{
  const b = e.target.closest('button'); if(!b) return;
  state.src = b.dataset.src;
  [...$('chips').children].forEach(x=>x.classList.toggle('active', x===b));
  save(); render();
};

// tabs
function show(tab){
  ['Study','Known','Wrong'].forEach(t=>{
    $('view'+t).classList.toggle('hidden', t!==tab);
    $('tab'+t).classList.toggle('active', t===tab);
  });
  if(tab==='Known') renderList('Known');
  if(tab==='Wrong') renderList('Wrong');
}
$('tabStudy').onclick = ()=>show('Study');
$('tabKnown').onclick = ()=>show('Known');
$('tabWrong').onclick = ()=>show('Wrong');

function renderList(which){
  const kind = which==='Known' ? 'known' : 'wrong';
  const box = $('list'+which);
  const items = state[kind];
  if(!items.length){ box.innerHTML = '<div class="empty">Burada henüz kelime yok.</div>'; return; }
  box.innerHTML = [...items].reverse().map(w=>{
    const c = byWord.get(w);
    return '<div class="row"><b>'+esc(c.w)+'</b><span>'+esc(c.tr)+'</span><button data-w="'+esc(w)+'">Geri koy</button></div>';
  }).join('');
  box.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    state[kind] = state[kind].filter(x=>x!==b.dataset.w);
    state.order = [b.dataset.w, ...state.order.filter(x=>x!==b.dataset.w)];
    save(); render(); renderList(which);
  });
}
function retryWrong(){
  const w = state.wrong; state.wrong = [];
  state.order = [...shuffle([...w]), ...state.order.filter(x=>!w.includes(x))];
  state.src = 'all'; [...$('chips').children].forEach(x=>x.classList.toggle('active', x.dataset.src==='all'));
  history = []; save(); render(); show('Study');
}
$('retryWrong').onclick = retryWrong;
$('studyWrong').onclick = ()=>{ if(state.wrong.length) retryWrong(); };

// reset needs two taps (no pop-up dialogs)
let resetArmed = false;
$('resetAll').onclick = ()=>{
  const b = $('resetAll');
  if(!resetArmed){ resetArmed = true; b.textContent = 'Emin misin? Tekrar dokun: her şey silinir'; setTimeout(()=>{resetArmed=false; b.textContent='Baştan başla (her şeyi sıfırla)';},4000); return; }
  resetArmed = false; b.textContent='Baştan başla (her şeyi sıfırla)';
  state = {known:[],wrong:[],order:shuffle(CARDS.map(c=>c.id)),src:'all',auto:state.auto};
  [...$('chips').children].forEach(x=>x.classList.toggle('active', x.dataset.src==='all'));
  history = []; save(); render();
};

$('chips').innerHTML = '<button data-src="all">Hepsi</button>' + CATS.map(c=>'<button data-src="'+c.k+'">'+esc(c.n)+'</button>').join('');
load();
$('autoSpeak').checked = !!state.auto;
[...$('chips').children].forEach(x=>x.classList.toggle('active', x.dataset.src===state.src));
render();
</script>
</body>
