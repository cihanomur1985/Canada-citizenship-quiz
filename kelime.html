<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelime Kartları — Canada Citizenship</title>
<style>
:root{
  --navy:#152841; --paper:#F6F4EE; --card:#ffffff; --ink:#1a1a1a; --muted:#6b6f76;
  --red:#a8333f; --red-dark:#7d2530; --gold:#b8933f; --green:#2f6b4f; --green-dark:#22503b; --line:#dedad0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;min-height:100vh;}
.app{max-width:560px;margin:0 auto;padding:0 16px 40px;}
header{background:var(--navy);color:var(--paper);margin:0 -16px 16px;padding:20px 16px 16px;border-bottom:4px solid var(--red);}
header h1{margin:0 0 4px;font-size:1.35rem;font-weight:600;}
header p{margin:0;font:0.82rem -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#c7d2e0;}
.ui{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
.tabs{display:flex;gap:8px;margin-bottom:12px;}
.tabs button{flex:1;padding:10px 6px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:0.82rem;font-weight:600;color:var(--navy);cursor:pointer;}
.tabs button.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.tabs .n{display:inline-block;min-width:1.4em;margin-left:4px;padding:1px 6px;border-radius:10px;font-size:0.75rem;background:rgba(0,0,0,.08);}
.tabs button.active .n{background:rgba(255,255,255,.2);}
.chips{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.chips button{padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:20px;font-size:0.78rem;cursor:pointer;color:var(--ink);}
.chips button.active{background:var(--gold);border-color:var(--gold);color:#fff;}
.progress{font-size:0.78rem;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px;}
.bar i{display:block;height:100%;background:var(--green);width:0;transition:width .3s;}

.scene{perspective:1200px;}
.card{position:relative;width:100%;min-height:300px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s;}
.card.flipped{transform:rotateY(180deg);}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 2px 0 var(--line);}
.back{transform:rotateY(180deg);border-top:5px solid var(--gold);}
.front{border-top:5px solid var(--navy);}
.word{font-size:2.4rem;font-weight:600;line-height:1.15;margin:0;word-break:break-word;color:var(--navy);}
.tr{font-size:2rem;font-weight:600;color:var(--red);margin:0;line-height:1.2;}
.sent{margin:18px 0 0;font-size:0.8rem;line-height:1.5;color:var(--muted);max-width:44ch;}
.sent mark{background:#f4e6bd;color:var(--ink);border-radius:3px;padding:0 2px;}
.src{margin-top:12px;font:0.68rem -apple-system,sans-serif;color:var(--muted);}
.hint{position:absolute;bottom:10px;left:0;right:0;font:0.7rem -apple-system,sans-serif;color:#a3a6ab;}
.speak{margin-top:12px;border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:6px 14px;font-size:0.8rem;cursor:pointer;}
.small-word{font-size:0.95rem;color:var(--navy);margin:0 0 6px;}

.actions{display:flex;gap:10px;margin-top:16px;}
.actions button{flex:1;padding:15px 8px;border:none;border-radius:12px;color:#fff;font-size:0.95rem;font-weight:600;cursor:pointer;line-height:1.25;}
.actions small{display:block;font-weight:400;font-size:0.72rem;opacity:.85;margin-top:2px;}
.btn-wrong{background:var(--red);} .btn-wrong:active{background:var(--red-dark);}
.btn-known{background:var(--green);} .btn-known:active{background:var(--green-dark);}
.undo{display:block;margin:12px auto 0;background:none;border:none;color:var(--muted);font-size:0.78rem;text-decoration:underline;cursor:pointer;}

.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;}
.panel h2{margin:0 0 4px;font-size:1.05rem;color:var(--navy);}
.panel p.sub{margin:0 0 12px;font-size:0.8rem;color:var(--muted);}
.list{max-height:60vh;overflow:auto;border-top:1px solid var(--line);}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:0.9rem;align-items:center;}
.row b{color:var(--navy);} .row span{color:var(--red);text-align:right;}
.row button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:4px 8px;font-size:0.72rem;cursor:pointer;white-space:nowrap;}
.primary{width:100%;margin-top:12px;padding:13px;border:none;border-radius:12px;background:var(--navy);color:#fff;font-size:0.92rem;font-weight:600;cursor:pointer;}
.primary.red{background:var(--red);}
.ghost{width:100%;margin-top:8px;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:0.85rem;cursor:pointer;color:var(--ink);}
.empty{padding:26px 8px;text-align:center;color:var(--muted);font-size:0.88rem;}
.done{text-align:center;padding:10px 4px 4px;}
.done h2{font-size:1.3rem;margin:6px 0;}
.done .big{font-size:2.6rem;}
.hidden{display:none!important;}
@media (prefers-reduced-motion:reduce){.card{transition:none;}.bar i{transition:none;}}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
</style>
</head>
<body>
<div class="app ui">
  <header>
    <h1>Kelime Kartları</h1>
    <p>Soru bankası ve Discover Canada kılavuzundaki kelimeler · <span id="total"></span> kelime</p>
  </header>

  <div class="tabs">
    <button id="tabStudy" class="active">Çalış <span class="n" id="nLeft">0</span></button>
    <button id="tabKnown">Doğru kutusu <span class="n" id="nKnown">0</span></button>
    <button id="tabWrong">Yanlış sepeti <span class="n" id="nWrong">0</span></button>
  </div>

  <section id="viewStudy">
    <div class="chips" id="chips">
      <button data-src="all" class="active">Hepsi</button>
      <button data-src="quiz">Sorulardan</button>
      <button data-src="guide">Kılavuzdan</button>
    </div>
    <div class="progress"><span id="progText"></span><span id="progLeft"></span></div>
    <div class="bar"><i id="bar"></i></div>

    <div id="deck">
      <div class="scene">
        <div class="card" id="card" role="button" tabindex="0" aria-label="Kartı çevir">
          <div class="face front">
            <p class="word" id="fWord"></p>
            <button class="speak" id="speak" type="button">🔊 Dinle</button>
            <p class="sent" id="fSent"></p>
            <p class="src" id="fSrc"></p>
            <div class="hint">Türkçesi için karta dokun</div>
          </div>
          <div class="face back">
            <p class="small-word" id="bWord"></p>
            <p class="tr" id="bTr"></p>
            <p class="sent" id="bSent"></p>
            <div class="hint">Tekrar dokun: İngilizceye dön</div>
          </div>
        </div>
      </div>
      <div class="actions">
        <button class="btn-wrong" id="btnWrong">✗ Bilmiyorum<small>Yanlış sepetine at</small></button>
        <button class="btn-known" id="btnKnown">✓ Biliyorum<small>Doğru kutusuna at</small></button>
      </div>
      <button class="undo hidden" id="undo">↩ Son kartı geri al</button>
    </div>

    <div id="finished" class="panel hidden">
      <div class="done">
        <div class="big">🎉</div>
        <h2>Bu desteyi bitirdin</h2>
        <p class="sub" id="finText"></p>
      </div>
      <button class="primary red hidden" id="retryWrong">Yanlış sepetini tekrar çalış</button>
      <button class="ghost" id="resetAll">Baştan başla (her şeyi sıfırla)</button>
    </div>
  </section>

  <section id="viewKnown" class="hidden">
    <div class="panel">
      <h2>Doğru kutusu</h2>
      <p class="sub">Bildiğin kelimeler. Geri almak için "Geri koy"a bas.</p>
      <div class="list" id="listKnown"></div>
    </div>
  </section>

  <section id="viewWrong" class="hidden">
    <div class="panel">
      <h2>Yanlış sepeti</h2>
      <p class="sub">Bilemediğin kelimeler.</p>
      <div class="list" id="listWrong"></div>
      <button class="primary red" id="studyWrong">Bu sepeti tekrar çalış</button>
    </div>
  </section>
</div>

const KEY = 'ccq_vocab_v1';
const byWord = new Map(CARDS.map(c=>[c.w,c]));
let state = {known:[],wrong:[],order:[],src:'all'};
let history = [];   // last actions for undo (session only)

function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY)||'null');
    if(s && Array.isArray(s.known) && Array.isArray(s.wrong) && Array.isArray(s.order)){
      state = Object.assign(state, s);
    }
  }catch(e){}
  // drop words that no longer exist, append new ones
  const valid = w=>byWord.has(w);
  state.known = state.known.filter(valid);
  state.wrong = state.wrong.filter(valid);
  const seen = new Set(state.order.filter(valid));
  state.order = state.order.filter(valid);
  const fresh = CARDS.map(c=>c.w).filter(w=>!seen.has(w));
  shuffle(fresh); state.order.push(...fresh);
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const $ = id=>document.getElementById(id);
const esc = s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function queue(){
  const done = new Set([...state.known,...state.wrong]);
  return state.order.filter(w=>!done.has(w) && (state.src==='all' || byWord.get(w).src===state.src));
}
function sentenceHTML(c){
  const re = new RegExp('\\b('+c.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')\\b','i');
  const safe = esc(c.s);
  return safe.replace(re,'<mark>$1</mark>');
}
function srcLabel(c){ return c.src==='guide' ? 'Discover Canada kılavuzundan' : 'Soru bankasından'; }

function render(){
  const q = queue();
  $('total').textContent = CARDS.length;
  $('nLeft').textContent = q.length;
  $('nKnown').textContent = state.known.length;
  $('nWrong').textContent = state.wrong.length;
  const pool = state.src==='all' ? CARDS.length : CARDS.filter(c=>c.src===state.src).length;
  const doneInPool = pool - q.length;
  $('progText').textContent = doneInPool+' / '+pool+' kart işlendi';
  $('progLeft').textContent = q.length+' kaldı';
  $('bar').style.width = (pool? doneInPool/pool*100 : 0)+'%';
  $('undo').classList.toggle('hidden', history.length===0);

  if(q.length===0){
    $('deck').classList.add('hidden');
    $('finished').classList.remove('hidden');
    const w = state.wrong.length;
    $('finText').textContent = 'Doğru kutusu: '+state.known.length+' · Yanlış sepeti: '+w;
    $('retryWrong').classList.toggle('hidden', w===0);
    return;
  }
  $('finished').classList.add('hidden');
  $('deck').classList.remove('hidden');
  const c = byWord.get(q[0]);
  const card = $('card');
  card.classList.remove('flipped');
  $('fWord').textContent = c.w;
  $('bWord').textContent = c.w;
  $('bTr').textContent = c.tr;
  $('fSent').innerHTML = sentenceHTML(c);
  $('bSent').innerHTML = sentenceHTML(c);
  $('fSrc').textContent = srcLabel(c);
}
function currentWord(){ const q=queue(); return q.length? q[0] : null; }

function mark(kind){
  const w = currentWord(); if(!w) return;
  state[kind].push(w);
  history.push({w,kind});
  if(history.length>30) history.shift();
  save(); render();
}
$('btnKnown').onclick = ()=>mark('known');
$('btnWrong').onclick = ()=>mark('wrong');
$('undo').onclick = ()=>{
  const h = history.pop(); if(!h) return;
  state[h.kind] = state[h.kind].filter(x=>x!==h.w);
  // put it back at the front of the order so it is the next card
  state.order = [h.w, ...state.order.filter(x=>x!==h.w)];
  save(); render();
};
function flip(){ $('card').classList.toggle('flipped'); }
$('card').onclick = e=>{ if(e.target.closest('#speak')) return; flip(); };
$('card').onkeydown = e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); flip(); } };
document.addEventListener('keydown', e=>{
  if($('viewStudy').classList.contains('hidden')||$('deck').classList.contains('hidden')) return;
  if(e.key==='ArrowRight') mark('known');
  else if(e.key==='ArrowLeft') mark('wrong');
});
$('speak').onclick = e=>{
  e.stopPropagation();
  const w = currentWord(); if(!w) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(w); u.lang='en-CA'; u.rate=0.85;
    speechSynthesis.speak(u);
  }catch(err){}
};

// source filter
$('chips').onclick = e=>{
  const b = e.target.closest('button'); if(!b) return;
  state.src = b.dataset.src;
  [...$('chips').children].forEach(x=>x.classList.toggle('active', x===b));
  save(); render();
};

// tabs
function show(tab){
  ['Study','Known','Wrong'].forEach(t=>{
    $('view'+t).classList.toggle('hidden', t!==tab);
    $('tab'+t).classList.toggle('active', t===tab);
  });
  if(tab==='Known') renderList('Known');
  if(tab==='Wrong') renderList('Wrong');
}
$('tabStudy').onclick = ()=>show('Study');
$('tabKnown').onclick = ()=>show('Known');
$('tabWrong').onclick = ()=>show('Wrong');

function renderList(which){
  const kind = which==='Known' ? 'known' : 'wrong';
  const box = $('list'+which);
  const items = state[kind];
  if(!items.length){ box.innerHTML = '<div class="empty">Burada henüz kelime yok.</div>'; return; }
  box.innerHTML = [...items].reverse().map(w=>{
    const c = byWord.get(w);
    return '<div class="row"><b>'+esc(c.w)+'</b><span>'+esc(c.tr)+'</span><button data-w="'+esc(w)+'">Geri koy</button></div>';
  }).join('');
  box.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    state[kind] = state[kind].filter(x=>x!==b.dataset.w);
    state.order = [b.dataset.w, ...state.order.filter(x=>x!==b.dataset.w)];
    save(); render(); renderList(which);
  });
}
function retryWrong(){
  const w = state.wrong; state.wrong = [];
  state.order = [...shuffle([...w]), ...state.order.filter(x=>!w.includes(x))];
  state.src = 'all'; [...$('chips').children].forEach(x=>x.classList.toggle('active', x.dataset.src==='all'));
  history = []; save(); render(); show('Study');
}
$('retryWrong').onclick = retryWrong;
$('studyWrong').onclick = ()=>{ if(state.wrong.length) retryWrong(); };

// reset needs two taps (no pop-up dialogs)
let resetArmed = false;
$('resetAll').onclick = ()=>{
  const b = $('resetAll');
  if(!resetArmed){ resetArmed = true; b.textContent = 'Emin misin? Tekrar dokun: her şey silinir'; setTimeout(()=>{resetArmed=false; b.textContent='Baştan başla (her şeyi sıfırla)';},4000); return; }
  resetArmed = false; b.textContent='Baştan başla (her şeyi sıfırla)';
  state = {known:[],wrong:[],order:shuffle(CARDS.map(c=>c.w)),src:'all'};
  [...$('chips').children].forEach(x=>x.classList.toggle('active', x.dataset.src==='all'));
  history = []; save(); render();
};

load();
[...$('chips').children].forEach(x=>x.classList.toggle('active', x.dataset.src===state.src));
render();
</script>
</body>
</html>
